<!-- Supabase > Authentication > Emails > Invite user
     Subject: You're invited to upload widgets to Desk Widgets -->
<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#1d1d1f">
  <h1 style="font-size:24px;font-weight:600;margin:0 0 12px">You're invited.</h1>
  <p style="font-size:15px;line-height:1.5;margin:0 0 24px;color:#424245">You can now upload widgets to Desk Widgets. Accept the invite to choose your username and password.</p>
  <p style="margin:0 0 24px"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0071e3;color:#ffffff;text-decoration:none;font-size:15px;padding:11px 22px;border-radius:980px">Accept the Invite</a></p>
  <p style="font-size:13px;line-height:1.5;margin:0;color:#6e6e73">The button works once. If it has expired, ask the owner to send the invite again. If you weren't expecting this, you can ignore it.</p>
</div>
