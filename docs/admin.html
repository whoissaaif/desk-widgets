<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin Console · Desk Widgets</title>
  <link rel="stylesheet" href="assets/site.css">
  <style>
    /* ---- admin skeleton ---- */
    .admin-skel-cards { display: flex; gap: 16px; overflow: hidden; }
    .admin-skel-card { flex: 0 0 220px; }
    .admin-skel-card .art { aspect-ratio: 1/1; border-radius: var(--r-card); }
    .admin-skel-card .body { padding: 12px 14px; }
    .admin-skel-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
    .admin-skel-row { display: flex; gap: 14px; align-items: center; padding: 14px 16px; background: var(--card); border-radius: var(--r-field); }
    .admin-skel-row .icon { width: 40px; height: 40px; border-radius: 10px; }
    .admin-skel-row .lines { flex: 1; }

    /* ---- review horizontal scroll ---- */
    .review-scroll { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
    .review-scroll::-webkit-scrollbar { height: 6px; }
    .review-scroll::-webkit-scrollbar-thumb { background: var(--grey-line); border-radius: 3px; }
    .review-card { flex: 0 0 220px; display: flex; flex-direction: column; border-radius: var(--r-card); overflow: hidden;
      background: var(--card); cursor: pointer; transition: transform 200ms, box-shadow 200ms; }
    .review-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0, 0, 0, .08); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .review-card:hover { box-shadow: 0 4px 20px rgba(0, 0, 0, .3); } }
    :root[data-theme="dark"] .review-card:hover { box-shadow: 0 4px 20px rgba(0, 0, 0, .3); }
    .review-card .art { border-radius: 0; }
    .review-card .rc-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
    .review-card .rc-top { display: flex; align-items: center; gap: 8px; }
    .review-card .rc-name { font: 600 15px/20px var(--font-text); letter-spacing: -0.016em; margin: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .review-card .rc-meta { font: 400 12px/16px var(--font-text); color: var(--text-2); }
    .rc-badge { font: 600 11px/1 var(--font-text); padding: 3px 8px; border-radius: 980px; flex-shrink: 0;
      background: #fff4d6; color: #b64400; text-transform: uppercase; letter-spacing: .02em; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .rc-badge { background: rgba(255, 214, 10, .15); color: #ff791b; } }
    :root[data-theme="dark"] .rc-badge { background: rgba(255, 214, 10, .15); color: #ff791b; }

    /* ---- expanded review panel ---- */
    .review-expand { background: var(--card); border-radius: var(--r-card); padding: 24px; margin-top: 16px; }
    .review-expand-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .review-expand-head .art-sm { width: 64px; height: 64px; border-radius: 14px; flex-shrink: 0; overflow: hidden; }
    .review-expand-head .art-sm .art { border-radius: 0; aspect-ratio: 1/1; }
    .review-expand-info { flex: 1; min-width: 0; }
    .review-expand-info h3 { font: 700 21px/26px var(--font-display); margin: 0; }
    .review-expand-info p { font: 400 13px/18px var(--font-text); color: var(--text-2); margin: 4px 0 0; }
    .review-close { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent;
      color: var(--text-2); cursor: pointer; display: grid; place-items: center; flex-shrink: 0; margin-left: auto; }
    .review-close:hover { background: var(--grey-fill); color: var(--text); }

    /* ---- collapsible All Widgets ---- */
    .section-toggle { display: flex; align-items: center; gap: 8px; background: none; border: 0;
      padding: 0; cursor: pointer; color: var(--text); width: 100%; text-align: left; }
    .section-toggle:hover h2 { color: var(--link); }
    .toggle-chevron { flex-shrink: 0; color: var(--text-2); transition: transform 200ms; fill: none;
      stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .section-toggle[aria-expanded="true"] .toggle-chevron { transform: rotate(90deg); }
    .section-count { font: 400 14px/20px var(--font-text); color: var(--text-2); margin-left: auto; }

    /* ---- all-widgets compact grid ---- */
    .aw-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0 16px; }
    .aw-search { flex: 1; min-width: 180px; height: 36px; padding: 0 14px; border-radius: var(--r-field);
      border: 1px solid var(--grey-line); background: var(--page); color: var(--text); font: 400 14px var(--font-text); }
    .aw-search:focus { outline: none; border-color: var(--blue-fill); box-shadow: var(--focus); }
    .aw-search::placeholder { color: var(--text-2); }
    .aw-seg { display: flex; gap: 2px; padding: 2px; background: var(--grey-fill); border-radius: 9px; }
    .aw-seg button { height: 32px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent;
      color: var(--text); font: 500 13px/1 var(--font-text); cursor: pointer; transition: background 160ms; }
    .aw-seg button[aria-pressed="true"] { background: var(--page); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .aw-seg button[aria-pressed="true"] {
      background: #636366; box-shadow: 0 1px 3px rgba(0, 0, 0, .4); } }
    :root[data-theme="dark"] .aw-seg button[aria-pressed="true"] {
      background: #636366; box-shadow: 0 1px 3px rgba(0, 0, 0, .4); }
    .aw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
    .aw-row { display: flex; align-items: center; gap: 14px; padding: 14px 16px;
      background: var(--card); border-radius: var(--r-field); min-width: 0; }
    .aw-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--grey-fill);
      display: grid; place-items: center; flex-shrink: 0; font: 600 16px/1 var(--font-text); color: var(--text-2); }
    .aw-info { flex: 1; min-width: 0; }
    .aw-name { font: 600 15px/20px var(--font-text); letter-spacing: -0.016em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .aw-meta { font: 400 12px/16px var(--font-text); color: var(--text-2);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .aw-pill { font: 600 11px/1 var(--font-text); padding: 4px 10px; border-radius: 980px;
      text-transform: uppercase; letter-spacing: .02em; flex-shrink: 0; }
    .aw-pill.approved { color: var(--green-text); background: #e3f3e7; }
    .aw-pill.pending { color: #8a5a00; background: #fff4d6; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .aw-pill.approved { color: #30d158; background: rgba(48, 209, 88, .15); }
      :root:not([data-theme="light"]) .aw-pill.pending { color: #ffd60a; background: rgba(255, 214, 10, .15); }
    }
    :root[data-theme="dark"] .aw-pill.approved { color: #30d158; background: rgba(48, 209, 88, .15); }
    :root[data-theme="dark"] .aw-pill.pending { color: #ffd60a; background: rgba(255, 214, 10, .15); }
    .aw-del { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent;
      color: var(--text-2); cursor: pointer; display: grid; place-items: center; flex-shrink: 0; }
    .aw-del:hover { background: var(--grey-fill); color: var(--red-text); }

    /* ---- empty queue state ---- */
    .admin-empty { text-align: center; padding: 48px 20px; }
    .admin-empty-icon { display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 12px;
      border-radius: 50%; background: #e3f3e7; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .admin-empty-icon { background: rgba(48, 209, 88, .15); } }
    :root[data-theme="dark"] .admin-empty-icon { background: rgba(48, 209, 88, .15); }
    .admin-empty p { font: 400 15px/21px var(--font-text); color: var(--text-2); margin: 0; }
    .admin-empty .title { font: 600 17px/22px var(--font-text); color: var(--text); margin-bottom: 4px; }
  </style>
</head>
<body>
  <main class="content section">
    <h1 class="t-section two-tone">Admin. <span class="tail">Read it, then decide.</span></h1>
    <p class="t-intro">Approving pins the hash of exactly the text shown here. The app installs nothing else.</p>
    <div id="page" style="margin-top: 40px">
      <!-- skeleton shown while data loads -->
      <h2 class="block">Waiting for Review</h2>
      <div class="admin-skel-cards">
        <div class="admin-skel-card"><div class="art skeleton"></div><div class="body"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div>
        <div class="admin-skel-card"><div class="art skeleton"></div><div class="body"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div>
        <div class="admin-skel-card"><div class="art skeleton"></div><div class="body"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div>
        <div class="admin-skel-card"><div class="art skeleton"></div><div class="body"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div>
      </div>
      <h2 class="block" style="margin-top:48px">All Widgets</h2>
      <div class="admin-skel-rows">
        <div class="admin-skel-row"><div class="icon skeleton"></div><div class="lines"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div>
        <div class="admin-skel-row"><div class="icon skeleton"></div><div class="lines"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div>
        <div class="admin-skel-row"><div class="icon skeleton"></div><div class="lines"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div>
        <div class="admin-skel-row"><div class="icon skeleton"></div><div class="lines"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { nav, el, art, notice, supabase, categoryName, categoryIcon, formatDate, sha256Hex, isValidId, hiddenCharacters, visibleSource, toast, confirmDialog } from "./assets/site.js";
    import { requireAccount } from "./assets/account.js";

    nav("admin");
    const page = document.getElementById("page");

    function diff(before, after) {
      const a = before.split("\n"), b = after.split("\n");
      if (a.length * b.length > 4e6) return null;
      const n = a.length, m = b.length, L = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
      for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
        L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
      const out = [];
      let i = 0, j = 0;
      while (i < n || j < m) {
        if (i < n && j < m && a[i] === b[j]) { out.push(["  ", a[i]]); i++; j++; }
        else if (j < m && (i === n || L[i][j + 1] >= L[i + 1][j])) out.push(["+ ", b[j++]]);
        else out.push(["- ", a[i++]]);
      }
      return out;
    }

    function codeBlock(source, previous) {
      source = visibleSource(source);
      const lines = previous != null ? diff(visibleSource(previous), source) : null;
      if (!lines) return el("pre", { class: "code" }, source);
      return el("pre", { class: "code diff" }, lines.map(([mark, text]) =>
        el("span", { class: mark === "+ " ? "add" : mark === "- " ? "del" : null }, mark + text + "\n")));
    }

    function chevron() {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("class", "toggle-chevron");
      svg.setAttribute("width", "16");
      svg.setAttribute("height", "16");
      svg.setAttribute("viewBox", "0 0 16 16");
      const path = document.createElementNS(ns, "path");
      path.setAttribute("d", "M6 4l4 4-4 4");
      svg.appendChild(path);
      return svg;
    }

    const trashIcon = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4.5h10M6.5 4.5V3a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5M5 4.5l.5 8.5h5l.5-8.5"/></svg>';
    const closeIcon = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
    const checkIcon = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';

    async function main() {
      const who = await requireAccount();
      if (!who) return;
      if (!who.admin) { page.replaceChildren(notice("This page is for the owner.", true)); return; }
      const db = await supabase();

      const [{ data: pending, error }, { data: allWidgets }, { data: allVersions }, { data: allProfiles }] = await Promise.all([
        db.from("versions").select("widget_id, version, name, category, description, api_version, source, preview, created_at")
          .eq("status", "pending").order("created_at"),
        db.from("widgets").select("id, slug, owner, created_at").order("id"),
        db.from("versions").select("widget_id, version, name, status"),
        db.from("profiles").select("id, username"),
      ]);
      if (error) throw error;

      const pendingWidgetIds = [...new Set((pending || []).filter(v => isValidId(v.widget_id)).map(v => v.widget_id))];
      const prevMap = {};
      if (pendingWidgetIds.length) {
        const { data: prevVersions } = await db.from("versions").select("widget_id, version, source")
          .in("widget_id", pendingWidgetIds).eq("status", "approved")
          .order("version", { ascending: false });
        for (const pv of prevVersions || [])
          if (!prevMap[pv.widget_id]) prevMap[pv.widget_id] = pv;
      }

      // ---- review cards (horizontal scroll) ----
      const expandHost = el("div");
      let openCard = null;

      function expandReview(v, prev, card) {
        if (openCard === card) { expandHost.replaceChildren(); openCard = null; return; }
        openCard = card;
        const hidden = hiddenCharacters(v.source);
        const result = el("div");
        const decide = async (approve) => {
          const { error } = approve
            ? await db.rpc("approve", { p_widget: v.widget_id, p_version: v.version, p_sha256: await sha256Hex(v.source) })
            : await db.rpc("reject", { p_widget: v.widget_id, p_version: v.version });
          if (error) { result.replaceChildren(notice(error.message, true)); return; }
          result.replaceChildren(notice(approve ? "Approved. It's live." : "Rejected."));
          card.remove();
        };
        const close = el("button", { class: "review-close", type: "button", onclick: () => { expandHost.replaceChildren(); openCard = null; } });
        close.innerHTML = closeIcon;
        expandHost.replaceChildren(el("div", { class: "review-expand" },
          el("div", { class: "review-expand-head" },
            el("div", { class: "art-sm" }, art(v.preview, v.name, v.category)),
            el("div", { class: "review-expand-info" },
              el("h3", {}, v.name),
              el("p", {}, v.widget_id + " · version " + v.version + " · " + categoryName(v.category) +
                " · API " + v.api_version + " · " + (prev ? "Changes since v" + prev.version + " below." : "First version: full source below."))),
            close),
          el("h4", { class: "t-headline", style: "margin: 0 0 8px; color: var(--text-2)" }, "Source"),
          hidden.length ? notice("This version contains hidden characters (" +
            hidden.slice(0, 5).map(h => h.code + " on line " + h.line).join(", ") + (hidden.length > 5 ? ", …" : "") +
            "). Reject it.", true) : null,
          codeBlock(v.source, prev ? prev.source : null),
          el("div", { class: "actions" },
            el("button", { class: "button destructive", type: "button", onclick: () => decide(false) }, "Reject"),
            el("button", { class: "button", type: "button", disabled: hidden.length > 0, onclick: () => decide(true) }, "Approve Version " + v.version)),
          result));
      }

      const reviewCards = [];
      for (const v of pending || []) {
        if (!isValidId(v.widget_id)) continue;
        const prev = prevMap[v.widget_id] || null;
        const card = el("div", { class: "review-card", onclick: () => expandReview(v, prev, card) },
          art(v.preview, v.name, v.category),
          el("div", { class: "rc-body" },
            el("div", { class: "rc-top" },
              el("h3", { class: "rc-name" }, v.name),
              el("span", { class: "rc-badge" }, "v" + v.version)),
            el("div", { class: "rc-meta" }, categoryName(v.category) + " · API " + v.api_version),
            el("div", { class: "rc-meta" }, "Sent " + formatDate(v.created_at))));
        reviewCards.push(card);
      }

      const emptyIcon = el("div", { class: "admin-empty-icon" });
      emptyIcon.innerHTML = checkIcon;
      const emptyQueue = el("div", { class: "admin-empty" },
        emptyIcon,
        el("p", { class: "title" }, "All clear"),
        el("p", {}, "Nothing is waiting for review."));

      // ---- all widgets (collapsed by default) ----
      const profileMap = Object.fromEntries((allProfiles || []).map(p => [p.id, p.username]));
      const versionsByWidget = {};
      for (const v of allVersions || []) {
        (versionsByWidget[v.widget_id] ||= []).push(v);
      }

      let awFilter = "all";
      let awQuery = "";
      const awGrid = el("div", { class: "aw-grid" });

      function renderWidgets() {
        const rows = [];
        for (const w of allWidgets || []) {
          const vs = versionsByWidget[w.id] || [];
          const latest = vs.length ? vs.reduce((a, b) => b.version > a.version ? b : a, vs[0]) : null;
          const approved = vs.some(v => v.status === "approved");
          const name = latest ? latest.name : w.slug;
          const author = profileMap[w.owner] || "unknown";
          if (awFilter === "approved" && !approved) continue;
          if (awFilter === "pending" && approved) continue;
          if (awQuery && !(name + " " + w.id + " " + author).toLowerCase().includes(awQuery)) continue;
          const row = el("div", { class: "aw-row" });
          const delBtn = el("button", { class: "aw-del", type: "button", "aria-label": "Delete", onclick: () => {
            confirmDialog("Delete this widget?", w.id + " and all its versions will be permanently removed.", "Delete Widget", async () => {
              const { error } = await db.rpc("delete_widget", { p_widget: w.id });
              if (error) { toast(error.message); return; }
              row.remove();
              toast("Deleted " + w.id + ".");
            });
          } });
          delBtn.innerHTML = trashIcon;
          row.replaceChildren(
            el("div", { class: "aw-icon" }, name.charAt(0).toUpperCase()),
            el("div", { class: "aw-info" },
              el("div", { class: "aw-name" }, name),
              el("div", { class: "aw-meta" }, "by " + author + " · " + vs.length + " version" + (vs.length !== 1 ? "s" : ""))),
            el("span", { class: "aw-pill " + (approved ? "approved" : "pending") }, approved ? "approved" : "pending"),
            delBtn);
          rows.push(row);
        }
        awGrid.replaceChildren(...rows);
        if (!rows.length) awGrid.replaceChildren(el("p", { class: "t-reduced", style: "padding: 20px 0" }, "No widgets match."));
      }

      const awSearch = el("input", { class: "aw-search", type: "search", placeholder: "Search widgets", "aria-label": "Search widgets",
        oninput: () => { awQuery = awSearch.value.trim().toLowerCase(); renderWidgets(); } });
      const segAll = el("button", { type: "button", "aria-pressed": "true", onclick: () => setFilter("all", segAll) }, "All");
      const segApproved = el("button", { type: "button", "aria-pressed": "false", onclick: () => setFilter("approved", segApproved) }, "Approved");
      const segPending = el("button", { type: "button", "aria-pressed": "false", onclick: () => setFilter("pending", segPending) }, "Pending");
      const segButtons = [segAll, segApproved, segPending];
      function setFilter(f, active) {
        awFilter = f;
        for (const b of segButtons) b.setAttribute("aria-pressed", String(b === active));
        renderWidgets();
      }
      renderWidgets();

      const awBody = el("div", { hidden: true },
        el("div", { class: "aw-toolbar" }, awSearch, el("div", { class: "aw-seg", role: "group" }, ...segButtons)),
        awGrid);
      const awCount = (allWidgets || []).length;
      const toggleBtn = el("button", { class: "section-toggle", "aria-expanded": "false", onclick: () => {
        const open = toggleBtn.getAttribute("aria-expanded") === "true";
        toggleBtn.setAttribute("aria-expanded", String(!open));
        awBody.hidden = open;
      } }, chevron(), el("h2", { class: "block", style: "margin: 0" }, "All Widgets"),
        el("span", { class: "section-count" }, awCount + " widget" + (awCount !== 1 ? "s" : "")));

      page.replaceChildren(
        el("p", { class: "t-reduced" }, "Signed in as " + who.profile.username + ", the owner."),
        el("h2", { class: "block" }, "Waiting for Review"),
        reviewCards.length ? el("div", { class: "review-scroll" }, reviewCards) : emptyQueue,
        expandHost,
        el("div", { style: "padding: 48px 0 16px" }, toggleBtn),
        awBody);
    }
    main().catch(() => page.replaceChildren(notice("This page couldn't load. Check your connection and reload.", true)));
  </script>
</body>
</html>
