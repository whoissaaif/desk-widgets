<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>New Password · Desk Widgets</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <main class="content section narrow">
    <div id="page"></div>
  </main>

  <script type="module">
    // Where "Change your password" emails land (resetPasswordForEmail). The link signs the person in
    // for this one purpose; they choose a new password here. Sign-in links go elsewhere.
    import { nav, el, notice, configured, me, supabase, toast } from "./assets/site.js";

    nav("password");
    const page = document.getElementById("page");
    const MIN_PASSWORD = 8;

    function header(title, tail, intro) {
      return [el("h1", { class: "t-section two-tone" }, title + " ", el("span", { class: "tail" }, tail)),
              el("p", { class: "t-intro" }, intro)];
    }

    function linkProblem(text) {
      page.replaceChildren(...header("Link expired.", "", "Password links work once, for an hour."),
        el("div", { style: "margin-top: 40px" }, notice(text, true)),
        el("div", { class: "actions" }, el("a", { class: "button", href: "login.html#forgot" }, "Send a New Link")));
    }

    async function main() {
      const hash = new URLSearchParams(location.hash.slice(1));
      if (hash.get("error_description")) {
        history.replaceState(null, "", location.pathname);
        return linkProblem(hash.get("error_description").replace(/\+/g, " ") + ".");
      }
      if (!configured) { page.replaceChildren(notice("Accounts aren't connected yet.")); return; }
      const who = await me(); // a recovery link signs in from the URL fragment
      history.replaceState(null, "", location.pathname); // keep tokens out of the address bar
      if (!who) return linkProblem("Open the most recent “Change your password” email and use its button. This page only works from that link.");

      const password = el("input", { class: "input", id: "password", type: "password", autocomplete: "new-password",
        minlength: String(MIN_PASSWORD), required: true });
      const confirm = el("input", { class: "input", id: "confirm", type: "password", autocomplete: "new-password", required: true });
      const result = el("div");
      const button = el("button", { class: "button", type: "submit" }, "Change Password");
      const form = el("form", { class: "form", onsubmit: async e => {
          e.preventDefault();
          const fail = text => { button.disabled = false; result.replaceChildren(notice(text, true)); };
          if (password.value.length < MIN_PASSWORD) return fail("Use at least " + MIN_PASSWORD + " characters.");
          if (password.value !== confirm.value) { confirm.select(); return fail("The two passwords don't match."); }
          button.disabled = true;
          const { error } = await (await supabase()).auth.updateUser({ password: password.value });
          if (error && error.code !== "same_password") return fail("Your password wasn't changed: " + error.message);
          toast("Password changed. You're signed in.", true);
          location.href = !who.profile ? "account.html" : who.admin ? "admin.html" : "upload.html";
        } },
        el("div", { class: "field" }, el("label", { for: "password" }, "New Password"), password,
          el("span", { class: "hint" }, "At least " + MIN_PASSWORD + " characters.")),
        el("div", { class: "field" }, el("label", { for: "confirm" }, "Confirm New Password"), confirm),
        el("div", {}, button),
        result);

      const name = who.profile ? who.profile.username : who.user.email;
      page.replaceChildren(...header("New password.", "Choose one you don't use elsewhere.", "For " + name + "."),
        el("div", { style: "margin-top: 40px" }), form);
      password.focus();
    }
    main().catch(() => page.replaceChildren(notice("This page couldn't load. Check your connection and reload.", true)));
  </script>
</body>
</html>
