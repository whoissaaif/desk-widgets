<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Your Account · Desk Widgets</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <header class="up-head" id="head" hidden>
    <h1 class="t-section">Your account.</h1>
    <p>Your photo and bio are public. Your email never is.</p>
  </header>
  <main class="up-main" id="page">
    <div class="up-form" aria-hidden="true">
      <div class="field"><span class="text-skeleton heading"></span><span class="text-skeleton field"></span></div>
      <div class="field"><span class="text-skeleton heading" style="width:30%"></span><span class="text-skeleton field" style="height:80px"></span></div>
    </div>
  </main>

  <script type="module">
    import { nav, el, notice, supabase, configured, me, toast, avatar, personCard } from "./assets/site.js";
    import { signInWithPassword } from "./assets/account.js";
    import { usingStub, stubbed, getMyWidgets, usernameTaken } from "./assets/data.js";

    nav("account");
    const page = document.getElementById("page");
    const head = document.getElementById("head");
    const PHOTO = 512;                 // the square the picked image is resized to
    const MIN_PASSWORD = 8;            // the rule this project already enforces
    const MAX_PHOTO_B64 = 6700000;     // isPhoto() in site.js, matching the profiles.avatar check

    const svg = (paths, size) => {
      const ns = "http://www.w3.org/2000/svg";
      const node = document.createElementNS(ns, "svg");
      node.setAttribute("viewBox", "0 0 24 24");
      node.setAttribute("width", String(size));
      node.setAttribute("height", String(size));
      node.setAttribute("class", "ico");
      node.setAttribute("aria-hidden", "true");
      for (const d of paths) {
        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", d);
        node.appendChild(path);
      }
      return node;
    };
    const ICON = {
      lock: ["M5 10.5h14v10.5H5z", "M8.25 10.5V8a3.75 3.75 0 0 1 7.5 0v2.5"],
      warn: ["M12 3.5 1.5 21h21L12 3.5z", "M12 10v4.5M12 17.5h.01"],
      check: ["M4.5 12.5l5 5 10-11"],
      eye: ["M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12z", "M12 9.25a2.75 2.75 0 1 0 0 5.5 2.75 2.75 0 0 0 0-5.5z"],
      eyeOff: ["M4 4l16 16", "M9.9 5.1A9.6 9.6 0 0 1 12 4.9c6 0 9.5 5.5 9.5 5.5a15 15 0 0 1-3.2 3.6M6.5 7.2A15 15 0 0 0 2.5 10.4S6 15.9 12 15.9c1 0 1.9-.2 2.7-.4"],
    };

    // Centre-crop to a square, resize to 512, and keep it as base64 the way profiles.avatar
    // stores it. WebP where the browser can encode it, PNG otherwise; site.js reads the format
    // back from the data's magic bytes.
    async function photoFrom(file) {
      // A GIF is stored as-is: putting it through the canvas would keep only the first frame.
      if (file.type === "image/gif") {
        const bytes = new Uint8Array(await file.arrayBuffer());
        let binary = "";
        for (let i = 0; i < bytes.length; i += 8192) binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
        const b64 = btoa(binary);
        if (b64.length > MAX_PHOTO_B64) throw new Error("gif too large");
        return b64;
      }
      const bitmap = await createImageBitmap(file);
      const side = Math.min(bitmap.width, bitmap.height);
      const canvas = Object.assign(document.createElement("canvas"), { width: PHOTO, height: PHOTO });
      const ctx = canvas.getContext("2d");
      ctx.imageSmoothingQuality = "high";
      ctx.drawImage(bitmap, (bitmap.width - side) / 2, (bitmap.height - side) / 2, side, side, 0, 0, PHOTO, PHOTO);
      bitmap.close();
      const webp = canvas.toDataURL("image/webp", 0.9);
      const url = webp.startsWith("data:image/webp") ? webp : canvas.toDataURL("image/png");
      const b64 = url.split(",")[1];
      if (b64.length > MAX_PHOTO_B64) throw new Error("too large");
      return b64;
    }

    const maskEmail = (address) => {
      if (!address || !address.includes("@")) return "";
      const [name, domain] = address.split("@");
      return name.slice(0, 1) + "•••••@" + domain;
    };

    async function main() {
      // A sign-up or password link that expired or was used already comes back with an error.
      const hash = new URLSearchParams(location.hash.slice(1));
      if (hash.get("error_description")) {
        page.replaceChildren(el("div", { class: "up-form" },
          el("h1", { class: "t-section" }, "Link expired."),
          notice(hash.get(“error_description”) + “. Try signing up again, or use “Forgot password” on the sign-in page.”, true),
          el("div", { class: "actions" }, el("a", { class: "button", href: "login.html" }, "Go to Sign In"))));
        return;
      }
      if (!configured && !usingStub) { page.replaceChildren(notice("Accounts aren't connected yet.")); return; }
      const who = usingStub ? await stubSession() : await me();
      if (!who) { location.replace("login.html?next=account.html"); return; }
      const db = configured && !usingStub ? await supabase() : null;
      const fresh = !who.profile;
      history.replaceState(null, "", location.pathname);   // keep tokens out of the address bar

      if (fresh) return firstTime(who, db);
      head.hidden = false;
      renderAccount(who, db);
    }

    async function stubSession() {
      const { getSession } = await import("./assets/data.js");
      return getSession();
    }

    // ---------------------------------------------------------------- the established account
    async function renderAccount(who, db) {
      const profile = who.profile;
      let photo = profile.avatar || null;
      let savedPhoto = photo;
      let username = profile.username;
      const widgets = await getMyWidgets(who.user.id).catch(() => []);
      const widgetCount = (widgets || []).length;

      // ---- aside: the live person card ----
      const asideCard = el("div");
      function paintCard() {
        asideCard.replaceChildren(personCard(
          { username, bio: bio.value.trim(), avatar: photo }, widgetCount,
          { href: null, emptyBio: "No bio yet.", emptyName: "your-name" }));
      }

      // ---- profile: photo ----
      const circle = el("div", { class: "photo-circle" });
      const paintCircle = () => circle.replaceChildren(avatar({ username, avatar: photo }, 88));
      const fileInput = el("input", { type: "file", id: "photo", class: "visually-hidden",
        accept: "image/png,image/jpeg,image/webp,image/gif" });
      const photoError = el("span", { class: "up-err", id: "photo-error", role: "status" });
      const removeButton = el("button", { type: "button", class: "up-link", hidden: !photo,
        onclick: () => { photo = null; fileInput.value = ""; removeButton.hidden = true; paintCircle(); paintCard(); touched(); } }, "Remove");
      fileInput.addEventListener("change", async () => {
        if (!fileInput.files[0]) return;
        photoError.textContent = "";
        try {
          photo = await photoFrom(fileInput.files[0]);
          removeButton.hidden = false;
          paintCircle();
          paintCard();
          touched();
        } catch (e) {
          photoError.textContent = e.message === "gif too large"
            ? "That GIF is over 5 MB. Try a smaller or shorter animation."
            : "That image couldn't be read. Try a PNG, JPG, WebP or GIF.";
        }
      });

      // ---- profile: bio ----
      const bio = el("textarea", { class: "input bio", id: "bio", rows: "3", maxlength: "160",
        placeholder: "One or two lines about you", "aria-describedby": "bio-hint" });
      bio.value = profile.bio || "";
      const bioCount = el("span", { class: "up-count" }, bio.value.length + " / 160");
      bio.addEventListener("input", () => {
        bioCount.textContent = bio.value.length + " / 160";
        paintCard();
        touched();
      });

      const saveProfile = el("button", { class: "button", type: "submit", disabled: true }, "Save Profile");
      const savedFlag = el("span", { class: "saved-flag", hidden: true }, svg(ICON.check, 14), " Saved");
      const profileError = el("div");
      const savedBio = () => profile.bio || "";
      function dirty() { return photo !== savedPhoto || bio.value.trim() !== savedBio(); }
      function touched() { saveProfile.disabled = !dirty(); }

      const profileForm = el("form", { class: "account-section", onsubmit: async (e) => {
          e.preventDefault();
          profileError.replaceChildren();
          saveProfile.disabled = true;
          saveProfile.replaceChildren(el("span", { class: "spinner" }), " Saving…");
          let error = null;
          if (usingStub) await stubbed("account", 500);
          else {
            const res = await db.from("profiles")
              .update({ username, bio: bio.value.trim(), avatar: photo }).eq("id", who.user.id);
            error = res.error;
          }
          saveProfile.replaceChildren("Save Profile");
          if (error) {
            profileError.replaceChildren(notice("Your changes weren't saved: " + error.message, true));
            saveProfile.disabled = false;
            return;
          }
          savedPhoto = photo;
          profile.bio = bio.value.trim();
          touched();
          savedFlag.hidden = false;
          setTimeout(() => { savedFlag.hidden = true; }, 2000);
        } },
        el("h2", {}, "Profile"),
        el("div", { class: "up-fields" },
          el("div", { class: "photo-row" }, circle,
            el("div", { class: "photo-actions" },
              el("div", { class: "up-label" }, "Profile photo"),
              el("div", { class: "photo-links" },
                el("label", { class: "up-link", for: "photo" }, "Change photo", fileInput),
                removeButton),
              el("span", { class: "hint" }, "Square crop, shown at 72px. PNG, JPG, WebP or GIF (animation is kept)."),
              photoError)),
          el("div", { class: "field" },
            el("div", { class: "up-row-label" }, el("label", { for: "bio" }, "Bio"), bioCount),
            bio,
            el("span", { class: "hint", id: "bio-hint" }, "Shown on your profile and under your name in Explore.")),
          el("div", { class: "save-row" }, saveProfile, savedFlag),
          profileError));

      // ---------------------------------------------------------- sign-in and security
      // ---- username ----
      const nameText = el("span", { class: "locked-value" }, username);
      const lockedRow = el("div", { class: "locked-row" }, svg(ICON.lock, 16), nameText,
        el("button", { type: "button", class: "up-link", onclick: () => openUsername() }, "Change…"));
      const usernameBox = el("div", {}, lockedRow);

      function openUsername() {
        const input = el("input", { class: "input", id: "username", value: username, maxlength: "24",
          autocapitalize: "none", spellcheck: "false", autocomplete: "username",
          "aria-describedby": "username-state" });
        const state = el("span", { class: "hint", id: "username-state", role: "status" });
        const save = el("button", { type: "button", class: "button small", disabled: true }, "Save Username");
        const cancel = el("button", { type: "button", class: "button grey small",
          onclick: () => { usernameBox.replaceChildren(lockedRow); } }, "Cancel");
        let timer = 0;

        async function check() {
          const value = input.value.trim().toLowerCase();
          save.disabled = true;
          if (value === username) { state.textContent = ""; state.className = "hint"; return; }
          if (!/^[a-z0-9-]{2,24}$/.test(value)) {
            state.textContent = "2–24 lowercase letters, digits or hyphens.";
            state.className = "hint bad";
            return;
          }
          state.textContent = "Checking…";
          state.className = "hint";
          clearTimeout(timer);
          timer = setTimeout(async () => {
            let taken;
            try { taken = await usernameTaken(value); }
            catch (error) {
              if (input.value.trim().toLowerCase() !== value) return;
              state.textContent = "Couldn't check availability. Try again.";
              state.className = "hint bad";
              return;
            }
            if (input.value.trim().toLowerCase() !== value) return;
            state.textContent = taken ? "Already taken" : "Available";
            state.className = "hint " + (taken ? "bad" : "good");
            save.disabled = taken;
          }, 300);
        }
        input.addEventListener("input", () => { input.value = input.value.toLowerCase(); check(); });

        save.addEventListener("click", async () => {
          const value = input.value.trim().toLowerCase();
          save.disabled = true;
          save.replaceChildren(el("span", { class: "spinner" }), " Saving…");
          let error = null;
          if (usingStub) await stubbed("account", 500);
          else {
            const res = await db.from("profiles").update({ username: value, bio: bio.value.trim(), avatar: photo })
              .eq("id", who.user.id);
            error = res.error;
          }
          save.replaceChildren("Save Username");
          if (error) {
            state.textContent = /username/.test(error.message) ? "That name is taken." : error.message;
            state.className = "hint bad";
            save.disabled = false;
            return;
          }
          username = value;
          profile.username = value;
          nameText.textContent = value;
          usernameBox.replaceChildren(lockedRow);
          paintCircle();
          paintCard();
          signedAs.replaceChildren("Signed in as ", el("strong", {}, username));
          const navName = document.querySelector(".nav .avatar");
          if (navName && !navName.src) navName.textContent = username.slice(0, 1).toUpperCase();
          toast("Username changed to " + value + ".");
        });

        usernameBox.replaceChildren(el("div", { class: "up-fields" },
          input,
          el("div", { class: "warn-box" }, svg(ICON.warn, 16),
            el("span", {}, "2–24 lowercase letters, digits or hyphens. You'll sign in with the new name. " +
              "Widgets you already sent keep their IDs (u." + username + ".…).")),
          state,
          el("div", { class: "actions" }, save, cancel)));
        input.focus();
        input.select();
      }

      // ---- email ----
      const email = who.user && who.user.email ? who.user.email : "";
      const emailField = email ? el("div", { class: "field" },
        el("div", { class: "up-label" }, "Email"),
        el("div", { class: "locked-row" }, svg(ICON.lock, 16),
          el("span", { class: "locked-value" }, maskEmail(email)),
          el("span", { class: "hint" }, "Private")),
        el("span", { class: "hint" }, "Used for sign-in links, never shown publicly.")) : null;

      // ---- password ----
      const current = el("input", { class: "input", id: "current-password", type: "password",
        autocomplete: "current-password" });
      const fresh2 = el("input", { class: "input pw", id: "new-password", type: "password",
        autocomplete: "new-password", "aria-describedby": "password-hint password-state" });
      const reveal = el("button", { type: "button", class: "pw-toggle", "aria-label": "Show password",
        "aria-pressed": "false", onclick: () => {
          const shown = fresh2.type === "text";
          fresh2.type = shown ? "password" : "text";
          reveal.setAttribute("aria-pressed", String(!shown));
          reveal.setAttribute("aria-label", shown ? "Show password" : "Hide password");
          reveal.replaceChildren(svg(shown ? ICON.eye : ICON.eyeOff, 20));
          fresh2.focus();
        } }, svg(ICON.eye, 20));
      const passwordState = el("div", { class: "hint", id: "password-state", role: "status" });
      const updateButton = el("button", { class: "button dark small", type: "submit" }, "Update Password");

      const passwordForm = el("form", { class: "password-card", onsubmit: async (e) => {
          e.preventDefault();
          passwordState.textContent = "";
          passwordState.className = "hint";
          if (fresh2.value.length < MIN_PASSWORD) {
            passwordState.textContent = "New password is too short.";
            passwordState.className = "hint bad";
            return;
          }
          updateButton.disabled = true;
          updateButton.replaceChildren(el("span", { class: "spinner" }), " Updating…");
          // The current password is checked by signing in with it again -- the same call the
          // sign-in page uses -- before anything is changed.
          let wrong = false, error = null;
          if (usingStub) { await stubbed("account", 500); wrong = current.value === "wrong"; }
          else {
            wrong = Boolean(await signInWithPassword(username, current.value));
            if (!wrong) {
              const res = await db.auth.updateUser({ password: fresh2.value });
              error = res.error && res.error.code !== "same_password" ? res.error : null;
            }
          }
          updateButton.disabled = false;
          updateButton.replaceChildren("Update Password");
          if (wrong) {
            passwordState.textContent = "Current password is wrong.";
            passwordState.className = "hint bad";
            return;
          }
          if (error) {
            passwordState.textContent = "The password wasn't changed: " + error.message;
            passwordState.className = "hint bad";
            return;
          }
          current.value = "";
          fresh2.value = "";
          passwordState.textContent = "Password updated";
          passwordState.className = "hint good";
          setTimeout(() => { passwordState.textContent = ""; }, 2000);
        } },
        el("div", { class: "up-label" }, "Change password"),
        el("div", { class: "field" }, el("label", { for: "current-password" }, "Current password"), current),
        el("div", { class: "field" }, el("label", { for: "new-password" }, "New password"),
          el("div", { class: "pw-wrap" }, fresh2, reveal),
          el("span", { class: "hint", id: "password-hint" }, "At least " + MIN_PASSWORD + " characters.")),
        passwordState,
        el("div", {}, updateButton));

      // ---- sign out ----
      const signedAs = el("span", { class: "hint" }, "Signed in as ", el("strong", {}, username));
      const signOut = el("button", { type: "button", class: "button grey small", onclick: async () => {
          if (usingStub) await stubbed("account", 500);
          else await (await supabase()).auth.signOut();
          toast("You're signed out.", true);
          location.href = "./";
        } }, "Sign Out");

      const security = el("section", { class: "account-section" },
        el("h2", {}, "Sign-in & security"),
        el("div", { class: "up-fields" },
          el("div", { class: "field" },
            el("div", { class: "up-label" }, "Username"),
            usernameBox,
            el("span", { class: "hint" }, "You sign in with it, and it's shown on your widgets.")),
          emailField,
          passwordForm,
          el("div", { class: "signout-row" }, signedAs, signOut)));

      paintCircle();
      paintCard();
      page.replaceChildren(
        el("div", { class: "upload-grid" },
          el("div", { class: "up-form" }, profileForm, security),
          el("aside", { class: "up-aside" },
            el("section", {},
              el("h3", {}, "How others see you"),
              asideCard,
              el("p", { class: "aside-link" },
                el("a", { class: "more", href: "profile.html?user=" + encodeURIComponent(username) }, "View your public profile"))))));

      window.addEventListener("beforeunload", (e) => {
        if (!dirty()) return;
        e.preventDefault();
        e.returnValue = "";
      });
    }

    // ---------------------------------------------------------------- first time setup
    function firstTime(who, db) {
      head.hidden = true;
      let photo = null;
      const circle = el("div", { class: "photo-circle" });
      const paint = () => circle.replaceChildren(avatar({ username: username.value, avatar: photo }, 88));
      const fileInput = el("input", { type: "file", id: "photo", class: "visually-hidden",
        accept: "image/png,image/jpeg,image/webp,image/gif" });
      fileInput.addEventListener("change", async () => {
        if (!fileInput.files[0]) return;
        try { photo = await photoFrom(fileInput.files[0]); paint(); } catch (e) { /* keep the initial */ }
      });
      const username = el("input", { class: "input", id: "username", required: true, pattern: "[a-z0-9-]{2,24}",
        maxlength: "24", autocapitalize: "none", spellcheck: "false", autocomplete: "username", placeholder: "moon-maker" });
      username.addEventListener("input", () => { username.value = username.value.toLowerCase(); paint(); });
      const password = el("input", { class: "input", id: "password", type: "password",
        autocomplete: "new-password", minlength: String(MIN_PASSWORD), required: true });
      const bio = el("textarea", { class: "input bio", id: "bio", rows: "3", maxlength: "160",
        placeholder: "One or two lines about you" });
      const result = el("div");
      const button = el("button", { class: "button", type: "submit" }, "Create Account");
      const form = el("form", { class: "account-section", onsubmit: async (e) => {
          e.preventDefault();
          const fail = (text) => { button.disabled = false; result.replaceChildren(notice(text, true)); };
          if (password.value.length < MIN_PASSWORD) return fail("Use at least " + MIN_PASSWORD + " characters for your password.");
          button.disabled = true;
          const { error } = await db.from("profiles")
            .insert({ id: who.user.id, username: username.value, bio: bio.value.trim(), avatar: photo });
          if (error) return fail(/username/.test(error.message)
            ? "The username " + username.value + " is taken. Try another." : "Your account wasn't created: " + error.message);
          const { error: passwordError } = await db.auth.updateUser({ password: password.value });
          if (passwordError && passwordError.code !== "same_password")
            return fail("Your account was created, but the password wasn't set: " + passwordError.message + " Reload this page to try again.");
          toast("Welcome, " + username.value + ". You're signed in.", true);
          location.href = "upload.html";
        } },
        el("h2", {}, "Finish your account"),
        el("div", { class: "up-fields" },
          el("div", { class: "photo-row" }, circle,
            el("div", { class: "photo-actions" },
              el("div", { class: "up-label" }, "Profile photo"),
              el("label", { class: "up-link", for: "photo" }, "Choose a photo", fileInput),
              el("span", { class: "hint" }, "Optional. PNG, JPG, WebP or GIF."))),
          el("div", { class: "field" }, el("label", { for: "username" }, "Username"), username,
            el("span", { class: "hint" }, "2 to 24 lowercase letters, digits or hyphens. You sign in with it, and it's part of your widgets' ids.")),
          el("div", { class: "field" }, el("label", { for: "password" }, "Password"), password,
            el("span", { class: "hint" }, "At least " + MIN_PASSWORD + " characters.")),
          el("div", { class: "field" }, el("label", { for: "bio" }, "Bio"), bio),
          el("div", {}, button),
          result));
      page.replaceChildren(el("div", { class: "up-form" },
        el("h1", { class: "t-section" }, "Welcome."),
        el("p", { class: "band-sub", style: "margin-left: 0; margin-right: 0" },
          "Choose how you'll sign in and how people see you."),
        form));
      toast("You're signed in. Set up your account below.");
      username.focus();
    }
    main().catch(() => page.replaceChildren(notice("This page couldn't load. Check your connection and reload.", true)));
  </script>
</body>
</html>
