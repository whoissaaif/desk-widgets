<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In · Desk Widgets</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <main class="content section narrow">
    <h1 class="t-section">Sign in.</h1>
    <p class="t-intro">Use the username and password you chose when you accepted your invite.</p>
    <div id="page" style="margin-top: 40px"></div>
  </main>

  <script type="module">
    import { nav, el, notice, supabase, configured, me, toast } from "./assets/site.js";
    import { signInWithPassword } from "./assets/account.js";

    nav("login");
    const page = document.getElementById("page");
    // Only pages on this site, never another origin.
    const raw = new URLSearchParams(location.search).get("next") || "";
    const next = /^[a-z-]+\.html$/.test(raw) && raw !== "login.html" ? raw : "upload.html";

    async function main() {
      if (!configured) { page.replaceChildren(notice("Accounts aren't connected yet.")); return; }
      const already = await me();
      if (already && already.profile) {
        page.replaceChildren(notice("You're signed in as " + already.profile.username + "."),
          el("div", { class: "actions" }, el("a", { class: "button", href: next }, "Continue")));
        return;
      }

      const username = el("input", { class: "input", id: "username", autocomplete: "username", required: true,
        autocapitalize: "none", spellcheck: "false", maxlength: "24" });
      const password = el("input", { class: "input", id: "password", type: "password", autocomplete: "current-password", required: true });
      const result = el("div");
      const button = el("button", { class: "button", type: "submit" }, "Sign In");
      const form = el("form", { class: "form", onsubmit: async e => {
          e.preventDefault();
          button.disabled = true;
          result.replaceChildren();
          const error = await signInWithPassword(username.value.trim().toLowerCase(), password.value);
          button.disabled = false;
          if (error) { result.replaceChildren(notice(error, true)); password.select(); return; }
          toast("Signed in as " + username.value.trim().toLowerCase() + ".", true);
          location.href = next;
        } },
        el("div", { class: "field" }, el("label", { for: "username" }, "Username"), username),
        el("div", { class: "field" }, el("label", { for: "password" }, "Password"), password),
        el("div", {}, button),
        result);

      // Two different emails, two different pages (Supabase sends each with its own template):
      // "Email me a sign-in link" signs in without a password and comes back to `next`;
      // "Forgot your password" sends a "Change your password" email that opens password.html.
      // Sign-ups are off, so unknown addresses get nothing, and the answer is the same either way.
      function emailForm(id, label, hint, buttonText, send, sent) {
        const email = el("input", { class: "input", type: "email", id, autocomplete: "email", required: true });
        const answer = el("div");
        const submit = el("button", { class: "button grey", type: "submit" }, buttonText);
        const form = el("form", { class: "form reveal", onsubmit: async e => {
            e.preventDefault();
            submit.disabled = true;
            const db = await supabase();
            const { error } = await send(db, email.value.trim());
            submit.disabled = false;
            // Too many emails in a short time is the one failure worth showing; the rest look like success.
            answer.replaceChildren(error && /rate limit|too many/i.test(error.message)
              ? notice("Too many emails were sent just now. Wait a few minutes, then try again.", true)
              : notice(sent));
          } },
          el("h2", { class: "t-headline" }, label),
          el("div", { class: "field" }, el("label", { for: id }, "Email"), email, el("span", { class: "hint" }, hint)),
          el("div", {}, submit),
          answer);
        form.open = () => { form.classList.add("open"); email.focus(); };
        return form;
      }
      const here = new URL(next, location.href).href;
      const linkForm = emailForm("link-email", "Sign in with an email link.", "The address your invite was sent to.",
        "Email Me a Sign-In Link",
        (db, address) => db.auth.signInWithOtp({ email: address, options: { shouldCreateUser: false, emailRedirectTo: here } }),
        "If that address has an account, a sign-in link is on its way. It works once, for an hour.");
      const forgotForm = emailForm("reset-email", "Change your password.", "The address your invite was sent to.",
        "Email Me a Password Link",
        (db, address) => db.auth.resetPasswordForEmail(address, { redirectTo: new URL("password.html", location.href).href }),
        "If that address has an account, an email to change your password is on its way. It works once, for an hour.");
      const show = form => e => {
        e.preventDefault();
        (form === linkForm ? forgotForm : linkForm).classList.remove("open");
        form.open();
      };

      page.replaceChildren(form,
        el("p", { class: "t-reduced", style: "margin-top: 32px" },
          el("a", { href: "#forgot", class: "more", onclick: show(forgotForm) }, "Forgot your password"),
          el("br"),
          el("a", { href: "#link", class: "more", onclick: show(linkForm) }, "Sign in with an email link instead"),
          el("br"),
          "No account? Uploading is by invitation. ", el("a", { class: "more", href: "upload.html#request" }, "Request access")),
        forgotForm, linkForm);
      if (location.hash === "#forgot") { forgotForm.open(); return; }
      if (location.hash === "#link") { linkForm.open(); return; }
      username.focus();
    }
    main().catch(() => page.replaceChildren(notice("This page couldn't load. Check your connection and reload.", true)));
  </script>
</body>
</html>
