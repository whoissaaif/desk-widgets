<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In · Desk Widgets</title>
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <main class="auth">
    <div class="auth-col" id="page"></div>
  </main>

  <script type="module">
    import { nav, el, notice, supabase, configured, me, toast } from "./assets/site.js";
    import { signInWithPassword } from "./assets/account.js";
    import { usingStub, stubbed } from "./assets/data.js";

    nav("login", { signedOut: usingStub });
    const page = document.getElementById("page");
    const raw = new URLSearchParams(location.search).get("next") || "";
    const next = "index.html";
    const METHOD_KEY = "dw-signin-method";
    const LINK_MINUTES = 60;

    const icon = (paths, size) => {
      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("width", String(size));
      svg.setAttribute("height", String(size));
      svg.setAttribute("class", "ico");
      svg.setAttribute("aria-hidden", "true");
      for (const d of paths) {
        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", d);
        svg.appendChild(path);
      }
      return svg;
    };
    const ICON = {
      alert: ["M12 3.5 1.5 21h21L12 3.5z", "M12 10v4.5M12 17.5h.01"],
      eye: ["M2.5 12S6 6.5 12 6.5 21.5 12 21.5 12 18 17.5 12 17.5 2.5 12 2.5 12z", "M12 9.25a2.75 2.75 0 1 0 0 5.5 2.75 2.75 0 0 0 0-5.5z"],
      eyeOff: ["M4 4l16 16", "M9.9 5.1A9.6 9.6 0 0 1 12 4.9c6 0 9.5 5.5 9.5 5.5a15 15 0 0 1-3.2 3.6M6.5 7.2A15 15 0 0 0 2.5 10.4S6 15.9 12 15.9c1 0 1.9-.2 2.7-.4"],
      mail: ["M3 6.5h18v11H3z", "M3 7l9 6 9-6"],
    };
    const stored = (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } };
    const store = (key, value) => { try { localStorage.setItem(key, value); } catch (e) { /* no storage */ } };

    async function main() {
      if (!configured && !usingStub) { page.replaceChildren(notice("Accounts aren't connected yet.")); return; }
      const already = usingStub ? null : await me();
      if (already && already.profile) {
        page.replaceChildren(notice("You're signed in as " + already.profile.username + "."),
          el("div", { class: "actions" }, el("a", { class: "button", href: next }, "Continue")));
        return;
      }

      // ---------- header and the method switch ----------
      const tabSignIn = el("button", { type: "button", class: "seg-tab", id: "tab-signin", role: "tab",
        "aria-selected": "true", "aria-controls": "panel" }, "Sign in");
      const tabSignUp = el("button", { type: "button", class: "seg-tab", id: "tab-signup", role: "tab",
        "aria-selected": "false", "aria-controls": "panel" }, "Sign up");
      const tabs = el("div", { class: "seg auth-seg", role: "tablist", "aria-label": "Sign in or sign up" }, tabSignIn, tabSignUp);
      const panel = el("div", { id: "panel", class: "auth-panel", role: "tabpanel" });

      // ---------- sign in (username + password) ----------
      const errorBanner = el("div", { class: "auth-err", role: "alert", hidden: true });
      const username = el("input", { class: "input", id: "username", autocomplete: "username", required: true,
        autocapitalize: "none", spellcheck: "false", maxlength: "24" });
      const password = el("input", { class: "input pw", id: "password", type: "password",
        autocomplete: "current-password", required: true });
      const reveal = el("button", { type: "button", class: "pw-toggle", "aria-label": "Show password",
        "aria-pressed": "false", onclick: () => {
          const shown = password.type === "text";
          password.type = shown ? "password" : "text";
          reveal.setAttribute("aria-pressed", String(!shown));
          reveal.setAttribute("aria-label", shown ? "Show password" : "Hide password");
          reveal.replaceChildren(icon(shown ? ICON.eye : ICON.eyeOff, 20));
          password.focus();
        } }, icon(ICON.eye, 20));
      const signInButton = el("button", { class: "button auth-submit", type: "submit" }, "Sign In");

      function showError() {
        errorBanner.replaceChildren(icon(ICON.alert, 16),
          el("span", {}, "That username and password don't match. Try again, or ",
            el("button", { type: "button", class: "up-link", onclick: () => selectTab(true) }, "sign up"), "."));
        errorBanner.hidden = false;
      }

      const signInForm = el("form", { class: "auth-form", onsubmit: async (e) => {
          e.preventDefault();
          errorBanner.hidden = true;
          signInButton.disabled = true;
          signInButton.replaceChildren(el("span", { class: "spinner" }), " Signing in…");
          username.disabled = password.disabled = reveal.disabled = true;
          const who = username.value.trim().toLowerCase();
          const error = usingStub
            ? (await stubbed(), password.value === "wrong" ? "That username and password don't match." : null)
            : await signInWithPassword(who, password.value);
          signInButton.disabled = false;
          signInButton.replaceChildren("Sign In");
          username.disabled = password.disabled = reveal.disabled = false;
          if (error) { showError(); password.select(); return; }
          toast("Signed in as " + who + ".", true);
          location.href = next;
        } },
        errorBanner,
        el("div", { class: "field" }, el("label", { for: "username" }, "Username"), username),
        el("div", { class: "field" },
          el("div", { class: "up-row-label" }, el("label", { for: "password" }, "Password"),
            el("a", { class: "auth-forgot", href: "#forgot", onclick: (e) => { e.preventDefault(); showReset(); } },
              "Forgot password?")),
          el("div", { class: "pw-wrap" }, password, reveal)),
        signInButton);

      // ---------- sign up (email → magic link that creates the account) ----------
      const here = new URL("account.html", location.href).href;
      const sendSignUp = (db, address) =>
        db.auth.signInWithOtp({ email: address, options: { shouldCreateUser: true, emailRedirectTo: here } });
      const sendReset = (db, address) =>
        db.auth.resetPasswordForEmail(address, { redirectTo: new URL("password.html", location.href).href });

      function emailMethod({ id, buttonText, send, heading, hint, back }) {
        const email = el("input", { class: "input", type: "email", id, autocomplete: "email", required: true,
          placeholder: "you@example.com", "aria-describedby": id + "-hint" });
        const button = el("button", { class: "button auth-submit", type: "submit" }, buttonText);
        const form = el("form", { class: "auth-form", onsubmit: async (e) => {
            e.preventDefault();
            button.disabled = true;
            button.replaceChildren(el("span", { class: "spinner" }), " Sending…");
            email.disabled = true;
            let rateLimited = false;
            if (usingStub) await stubbed();
            else {
              const db = await supabase();
              const { error } = await send(db, email.value.trim());
              rateLimited = Boolean(error && /rate limit|too many/i.test(error.message));
            }
            button.disabled = false;
            button.replaceChildren(buttonText);
            email.disabled = false;
            if (rateLimited) {
              panel.prepend(notice("Too many emails were sent just now. Wait a few minutes, then try again.", true));
              return;
            }
            showInbox(() => { panel.replaceChildren(form); email.value = ""; email.focus(); }, back);
          } },
          el("div", { class: "field" }, el("label", { for: id }, "Email"), email,
            el("span", { class: "hint", id: id + "-hint" }, hint)),
          button);
        form.focusFirst = () => email.focus();
        if (heading) form.prepend(el("h2", { class: "auth-heading" }, heading));
        return form;
      }

      const signUpForm = emailMethod({
        id: "signup-email", buttonText: "Create Account", send: sendSignUp,
        hint: "We'll send you a link to set up your account.",
        back: "Use a different email",
      });
      const resetForm = emailMethod({
        id: "reset-email", buttonText: "Email Me a Password Link", send: sendReset,
        heading: "Change your password.",
        hint: "The email on your account.",
        back: "Back to sign in",
      });

      function showInbox(again, backText) {
        panel.replaceChildren(el("div", { class: "inbox", role: "status" },
          el("span", { class: "inbox-icon" }, icon(ICON.mail, 24)),
          el("h2", {}, "Check your inbox."),
          el("p", {}, "A link is on its way. It works once and expires in " + LINK_MINUTES + " minutes."),
          el("button", { type: "button", class: "up-link", onclick: backText === "Back to sign in"
            ? () => selectTab(false) : again }, backText)));
      }

      function showReset() {
        tabSignIn.setAttribute("aria-selected", "false");
        tabSignUp.setAttribute("aria-selected", "false");
        panel.replaceChildren(resetForm);
        resetForm.focusFirst();
      }

      let first = true;
      function selectTab(signUp) {
        tabSignIn.setAttribute("aria-selected", String(!signUp));
        tabSignUp.setAttribute("aria-selected", String(signUp));
        panel.replaceChildren(signUp ? signUpForm : signInForm);
        store(METHOD_KEY, signUp ? "signup" : "signin");
        const wide = window.matchMedia("(min-width: 700px)").matches;
        if (!first || wide) {
          if (signUp) signUpForm.focusFirst();
          else username.focus();
        }
        first = false;
      }
      tabSignIn.addEventListener("click", () => selectTab(false));
      tabSignUp.addEventListener("click", () => selectTab(true));

      page.replaceChildren(
        el("h1", { class: "auth-title" }, "Welcome."),
        el("p", { class: "auth-sub" }, "Sign in or create an account to upload widgets."),
        tabs,
        panel);

      if (location.hash === "#forgot") { showReset(); first = false; return; }
      if (location.hash === "#signup") { selectTab(true); first = false; return; }
      selectTab(stored(METHOD_KEY) === "signup");
    }
    main().catch(() => page.replaceChildren(notice("This page couldn't load. Check your connection and reload.", true)));
  </script>
</body>
</html>
