<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · Desk Widgets</title>
  <meta name="description" id="meta-description" content="">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="modulepreload" href="assets/site.js">
  <link rel="modulepreload" href="config.js">
  <link rel="modulepreload" href="assets/data.js">
</head>
<body>
  <header class="pf-head" id="head" aria-hidden="true">
    <span class="text-skeleton avatar" style="width:112px;height:112px"></span>
    <span class="text-skeleton" style="width:140px;height:36px;margin-top:20px;border-radius:6px"></span>
    <span class="text-skeleton" style="width:80px;height:15px;margin-top:10px"></span>
    <span class="text-skeleton" style="width:280px;height:18px;margin-top:16px"></span>
  </header>
  <main class="content" id="page">
    <div class="head-row ruled" aria-hidden="true">
      <span class="text-skeleton heading" style="width:100px"></span>
    </div>
    <div class="explore-grid" style="margin-top:28px" aria-hidden="true">
      <div class="widget-card placeholder"><div class="art skeleton"></div><div class="widget-card-body"><div class="widget-card-text"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div></div>
      <div class="widget-card placeholder"><div class="art skeleton"></div><div class="widget-card-body"><div class="widget-card-text"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div></div>
      <div class="widget-card placeholder"><div class="art skeleton"></div><div class="widget-card-body"><div class="widget-card-text"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div></div>
      <div class="widget-card placeholder"><div class="art skeleton"></div><div class="widget-card-body"><div class="widget-card-text"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div></div>
    </div>
  </main>

  <script type="module">
    import { nav, el, art, avatar, notice, widgetCard, me } from "./assets/site.js";
    import { available, getProfile, getWidgets, getPreviews, getMyVersions, getPhoto } from "./assets/data.js";

    nav(null);
    const page = document.getElementById("page");
    const head = document.getElementById("head");
    const username = new URLSearchParams(location.search).get("user");

    const meta = (title, description) => {
      document.title = title;
      document.getElementById("meta-description").setAttribute("content", description);
    };

    function notFound() {
      head.hidden = true;
      meta("Not found · Desk Widgets", "No creator by that name.");
      page.replaceChildren(el("div", { class: "pf-missing" },
        el("h1", { class: "t-section" }, "No one's here."),
        el("p", { class: "pf-count" }, "There's no creator called " + username + "."),
        el("p", { style: "margin-top: 24px" }, el("a", { class: "more", href: "explore.html" }, "Explore widgets"))));
    }

    async function load() {
      if (!username || !/^[a-z0-9-]{2,24}$/.test(username)) {
        head.hidden = true;
        page.replaceChildren(notice("This link doesn't point to a profile.", true));
        return;
      }
      if (!available) { head.hidden = true; page.replaceChildren(notice("The community gallery isn't connected yet.")); return; }
      try {
        const [author, widgets, who] = await Promise.all([
          getProfile(username), getWidgets(), me().catch(() => null),
        ]);
        if (!author) return notFound();

        const owner = Boolean(who && who.profile && who.profile.username === username);
        const approved = (widgets || []).filter((w) => w.author === username);

        const [versions, previews] = await Promise.all([
          owner ? getMyVersions().catch(() => []) : Promise.resolve([]),
          getPreviews(approved.map((w) => w.id), "assets/img/").catch(() => new Map()),
        ]);

        const latest = new Map();
        const pending = [];
        if (owner) {
          for (const v of versions || []) if (!latest.has(v.widget_id)) latest.set(v.widget_id, v);
          const published = new Set(approved.map((w) => w.id));
          for (const [id, v] of latest) {
            if (v.status === "approved" || published.has(id)) continue;
            pending.push({ id, name: v.name, category: v.category, version: v.version,
              author: username, status: v.status });
          }
        }

        meta(author.username + " · Desk Widgets", author.bio || "Widgets by " + author.username);

        head.hidden = false;
        head.replaceChildren(
          avatar(author, 112),
          el("h1", { class: "pf-name" }, author.username),
          el("p", { class: "pf-count" }, approved.length + " widget" + (approved.length !== 1 ? "s" : "")),
          author.bio ? el("p", { class: "pf-bio" }, author.bio) : null,
          owner ? el("div", { class: "pf-actions" },
            el("a", { class: "button grey", href: "account.html" }, "Edit Profile"),
            el("a", { class: "more", href: "upload.html" }, "Upload a widget")) : null);
        const img = head.querySelector("img.avatar");
        if (img) img.alt = author.username;
        // The photo itself (sharper at this size, and it may be animated) arrives on its own
        // and replaces the small copy; the page never waits for it.
        getPhoto(username).then((photo) => {
          if (!photo) return;
          const full = avatar({ username, avatar: photo }, 112);
          full.alt = author.username;
          head.querySelector(".avatar").replaceWith(full);
        }).catch(() => {});

        const shown = [...approved, ...pending];
        const grid = shown.length
          ? el("div", { class: "explore-grid", style: "margin-top: 28px" })
          : el("p", { class: "pf-empty" }, owner ? "You haven't published any widgets yet. " : username + " hasn't published any widgets yet.",
              owner ? el("a", { class: "more", href: "upload.html" }, "Upload your first widget") : null);

        page.replaceChildren(
          el("div", { class: "head-row ruled" },
            el("h2", { class: "explore-head" }, "Widgets"),
            el("p", { class: "head-note" }, "Get opens Desk Widgets, which verifies the widget and asks before installing.")),
          grid);

        if (!shown.length) return;
        grid.replaceChildren(...shown.map((w) => {
          const newest = latest.get(w.id);
          const status = w.status || (newest && newest.status !== "approved" ? newest.status : undefined);
          return widgetCard(w, art(previews.get(w.id) || null, w.name, w.category),
            { author: false, status });
        }));
      } catch (e) {
        page.replaceChildren(notice("This page couldn't load. Check your connection and reload.", true));
      }
    }
    load();
  </script>
</body>
</html>
