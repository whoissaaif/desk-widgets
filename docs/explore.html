<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore · Desk Widgets</title>
  <meta name="description" content="Free, lightweight desktop widgets for Windows, and widgets made by the community.">
  <link rel="stylesheet" href="assets/site.css">
  <link rel="modulepreload" href="assets/site.js">
  <link rel="modulepreload" href="config.js">
  <link rel="modulepreload" href="assets/data.js">
  <link rel="preconnect" href="https://vtgsbgkjleyqlxgjdvqy.supabase.co">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm">
</head>
<body>
  <main class="content">
    <div class="explore-hero">
      <h1 class="t-section">Explore</h1>
      <p class="t-intro">Widgets made by the community, each one reviewed.</p>
      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="8.5" cy="8.5" r="5.5"/><line x1="13" y1="13" x2="17" y2="17"/>
        </svg>
        <input class="search-big" type="search" id="search" placeholder="Search widgets" autocomplete="off" aria-label="Search widgets">
        <div class="search-results" id="search-results" hidden></div>
      </div>
      <div class="seg" id="tabs" role="tablist" aria-label="What to browse">
        <button type="button" class="seg-tab" id="tab-widgets" role="tab" aria-selected="true" aria-controls="view-widgets">Widgets</button>
        <button type="button" class="seg-tab" id="tab-people" role="tab" aria-selected="false" aria-controls="view-people">People</button>
      </div>
    </div>

    <div class="explore-filters" id="filters" role="group" aria-label="Category"></div>

    <div id="view-widgets" role="tabpanel" aria-labelledby="tab-widgets">
      <div class="head-row">
        <h2 class="explore-head" id="widgets-head">All widgets</h2>
        <p class="head-note">Get opens Desk Widgets, which verifies the widget and asks before installing.</p>
      </div>
      <div id="status"></div>
      <div class="explore-grid" id="grid" aria-live="polite">
        <div class="widget-card placeholder"><div class="art skeleton"></div><div class="widget-card-body"><div class="widget-card-text"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div></div>
        <div class="widget-card placeholder"><div class="art skeleton"></div><div class="widget-card-body"><div class="widget-card-text"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div></div>
        <div class="widget-card placeholder"><div class="art skeleton"></div><div class="widget-card-body"><div class="widget-card-text"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div></div>
        <div class="widget-card placeholder"><div class="art skeleton"></div><div class="widget-card-body"><div class="widget-card-text"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div></div>
        <div class="widget-card placeholder"><div class="art skeleton"></div><div class="widget-card-body"><div class="widget-card-text"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div></div>
        <div class="widget-card placeholder"><div class="art skeleton"></div><div class="widget-card-body"><div class="widget-card-text"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div></div>
        <div class="widget-card placeholder"><div class="art skeleton"></div><div class="widget-card-body"><div class="widget-card-text"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div></div>
        <div class="widget-card placeholder"><div class="art skeleton"></div><div class="widget-card-body"><div class="widget-card-text"><span class="text-skeleton name"></span><span class="text-skeleton by"></span></div></div></div>
      </div>
    </div>

    <div id="view-people" role="tabpanel" aria-labelledby="tab-people" hidden>
      <h2 class="explore-head">Community</h2>
      <div class="people-grid" id="people-grid"></div>
    </div>

  </main>

  <script type="module">
    import { nav, el, art, avatar, getButton, categoryName, categoryIcon, isValidId, notice, DOWNLOAD_URL, widgetCard as card, personCard } from "./assets/site.js";
    import { getWidgets, getProfiles, getPreviews, getPhoto, available } from "./assets/data.js";

    nav("explore");

    const grid = document.getElementById("grid"), status = document.getElementById("status");
    const search = document.getElementById("search"), filters = document.getElementById("filters");
    const searchResults = document.getElementById("search-results");
    const viewWidgets = document.getElementById("view-widgets");
    const viewPeople = document.getElementById("view-people");
    const peopleGrid = document.getElementById("people-grid");
    const head = document.getElementById("widgets-head");
    const tabWidgets = document.getElementById("tab-widgets");
    const tabPeople = document.getElementById("tab-people");
    let widgets = [], authors = [], category = null, peopleMode = false;
    let peopleError = false;

    // Only the categories that actually have widgets, the busiest first. "All" always leads.
    function buildFilters() {
      const counts = new Map();
      for (const w of widgets) counts.set(w.category, (counts.get(w.category) || 0) + 1);
      const ordered = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      filters.replaceChildren(...[[null, "All"], ...ordered.map(([id]) => [id, categoryName(id)])]
        .map(([id, label]) => el("button", { type: "button", class: "pill",
          "aria-pressed": String(id === category), onclick: () => selectCategory(id),
          "data-id": String(id) }, label)));
    }

    function selectCategory(id) {
      category = id;
      for (const b of filters.children) b.setAttribute("aria-pressed", String(b.dataset.id === String(id)));
      head.textContent = id === null ? "All widgets" : categoryName(id);
      render();
    }

    function selectTab(people) {
      peopleMode = people;
      tabWidgets.setAttribute("aria-selected", String(!people));
      tabPeople.setAttribute("aria-selected", String(people));
      viewWidgets.hidden = people;
      viewPeople.hidden = !people;
      filters.hidden = people;
      search.placeholder = people ? "Search people" : "Search widgets";
      search.setAttribute("aria-label", search.placeholder);
      searchResults.hidden = true;
      if (people) renderPeople(); else render();
    }
    tabWidgets.addEventListener("click", () => selectTab(false));
    tabPeople.addEventListener("click", () => selectTab(true));

    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      if (!q) { searchResults.hidden = true; return; }
      renderSearchResults(q);
    });
    search.addEventListener("focus", () => {
      if (search.value.trim()) renderSearchResults(search.value.trim().toLowerCase());
    });
    document.addEventListener("click", e => {
      if (!e.target.closest(".search-wrap")) searchResults.hidden = true;
    });

    function renderSearchResults(q) {
      const matchedWidgets = widgets.filter(w => (w.name + " " + w.description + " " + w.author).toLowerCase().includes(q)).slice(0, 4);
      const matchedPeople = authors.filter(a => (a.username + " " + (a.bio || "")).toLowerCase().includes(q)).slice(0, 3);
      if (!matchedWidgets.length && !matchedPeople.length) { searchResults.hidden = true; return; }
      const sections = [];
      if (matchedPeople.length) {
        sections.push(el("div", { class: "sr-section" },
          el("div", { class: "sr-label" }, "People"),
          ...matchedPeople.map(a =>
            el("a", { class: "sr-item", href: "profile.html?user=" + encodeURIComponent(a.username) },
              avatar(a, 36),
              el("div", { style: "flex:1;min-width:0" },
                el("div", { class: "sr-name" }, a.username),
                el("div", { class: "sr-detail" }, a.bio || "No bio")),
              el("span", { class: "sr-arrow" }, "›")))));
      }
      if (matchedWidgets.length) {
        sections.push(el("div", { class: "sr-section" },
          el("div", { class: "sr-label" }, "Widgets"),
          ...matchedWidgets.map(w =>
            el("a", { class: "sr-item", href: "w/" + encodeURIComponent(w.id) + "/" },
              el("span", { class: "avatar square", style: "width:36px;height:36px;border-radius:10px;font-size:14px" },
                w.name.charAt(0).toUpperCase()),
              el("div", { style: "flex:1;min-width:0" },
                el("div", { class: "sr-name" }, w.name),
                el("div", { class: "sr-detail" }, w.author + " · " + categoryName(w.category))),
              el("span", { class: "sr-arrow" }, "›")))));
      }
      searchResults.replaceChildren(...sections);
      searchResults.hidden = false;
    }

    let previewBatchTimer = null;
    const pendingPreviews = new Map();

    const previewObserver = new IntersectionObserver((entries, obs) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        const artEl = entry.target, id = artEl.dataset.widgetId;
        obs.unobserve(artEl);
        pendingPreviews.set(id, artEl);
      }
      if (pendingPreviews.size && !previewBatchTimer)
        previewBatchTimer = setTimeout(flushPreviews, 50);
    }, { rootMargin: "200px" });

    async function flushPreviews() {
      previewBatchTimer = null;
      const batch = new Map(pendingPreviews);
      pendingPreviews.clear();
      const ids = [...batch.keys()];
      try {
        const map = await getPreviews(ids, "assets/img/");
        for (const [id, artEl] of batch) {
          const preview = map.get(id);
          const w = widgets.find(w => w.id === id);
          artEl.className = "art";
          if (preview) artEl.replaceChildren(el("img", { src: "data:image/png;base64," + preview, alt: (w ? w.name : id) + " preview" }));
          else artEl.replaceChildren(categoryIcon(w ? w.category : null));
        }
      } catch {
        for (const [id, artEl] of batch) {
          const w = widgets.find(candidate => candidate.id === id);
          artEl.className = "art";
          artEl.replaceChildren(categoryIcon(w ? w.category : null));
        }
      }
    }

    // Someone whose photo has no small copy yet (it is made on their next visit) starts as their
    // initial. The photo is fetched once their card is on screen, one person at a time since it
    // can be megabytes, and failing just leaves the initial.
    let photoQueue = Promise.resolve();
    const photoObserver = new IntersectionObserver((entries, obs) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        const card = entry.target, person = card.person;
        obs.unobserve(card);
        if (person.photoAsked) continue;
        person.photoAsked = true;
        photoQueue = photoQueue.then(() => getPhoto(person.username, true)).then((photo) => {
          if (!photo) return;
          person.avatar = photo;
          if (peopleMode) renderPeople();
        }).catch(() => {});
      }
    });

    // The card itself lives in site.js (the upload page shows the same component); this only
    // supplies the skeleton art element that previews are lazy-loaded into.
    function widgetCard(w) {
      const artEl = el("div", { class: "art skeleton", "data-widget-id": w.id });
      previewObserver.observe(artEl);
      return card(w, artEl);
    }

    function render() {
      const q = peopleMode ? "" : search.value.trim().toLowerCase();
      const shown = widgets.filter(w => (!category || w.category === category) &&
        (!q || (w.name + " " + w.description + " " + w.author).toLowerCase().includes(q)));
      grid.replaceChildren(...shown.map(widgetCard));
      if (widgets.length && !shown.length)
        grid.replaceChildren(el("p", { class: "empty" }, "No widgets match."));
    }

    function renderPeople() {
      if (peopleError) {
        peopleGrid.replaceChildren(notice("People couldn't load. Reload to try again.", true));
        return;
      }
      const q = search.value.trim().toLowerCase();
      const shown = authors.filter(a => !q || (a.username + " " + (a.bio || "")).toLowerCase().includes(q));
      const widgetCount = username => widgets.filter(w => w.author === username).length;
      peopleGrid.replaceChildren(...shown.map(a => {
        const count = widgetCount(a.username);
        const person = personCard(a, count);
        if (!a.avatar_thumb && !a.avatar) photoObserver.observe(Object.assign(person, { person: a }));
        return person;
      }));
      if (authors.length && !shown.length)
        peopleGrid.replaceChildren(el("p", { class: "empty" }, "No people match."));
    }

    async function load() {
      if (!available) { grid.replaceChildren(); status.replaceChildren(notice("The community gallery isn't connected yet. The built-in widgets come with the app.")); return; }
      getProfiles().then((data) => {
        authors = data || [];
        renderPeople();
      }).catch(() => {
        peopleError = true;
        renderPeople();
      });
      try {
        const widgetData = await getWidgets();
        widgets = (widgetData || []).filter(w => isValidId(w.id));
        buildFilters();
        if (!widgets.length) { grid.replaceChildren(); status.replaceChildren(el("div", { class: "empty" },
          el("p", { class: "t-card" }, "Nothing here yet."), el("p", {}, "Reviewed community widgets will appear here."))); }
        render();
        if (authors.length) renderPeople();
      } catch (e) {
        grid.replaceChildren();
        status.replaceChildren(notice("The gallery couldn't load. Check your connection and reload the page.", true));
      }
    }
    load();
  </script>
</body>
</html>
